<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pedidos - DoloYa Repartidor</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif}
body{background:#f6f8fb;min-height:100vh}
.header{height:64px;background:white;display:flex;align-items:center;justify-content:space-between;padding:0 18px;border-bottom:1px solid #e5e7eb;position:sticky;top:0;z-index:10}
.left{display:flex;align-items:center;gap:14px}
.btn-x{width:36px;height:36px;background:#E30613;border-radius:50%;display:flex;align-items:center;justify-content:center;border:none;cursor:pointer}
.btn-x svg{stroke:white}
.header h1{font-size:28px;font-weight:800;color:#111}
.right{position:relative}
.bell{width:38px;height:38px;display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative}
.bell-count{position:absolute;top:-4px;right:-4px;background:#E30613;color:white;min-width:20px;height:20px;border-radius:50%;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;border:2px solid white}
.bell.vibrar{animation:bell3D .12s infinite;transform-style:preserve-3d}
@keyframes bell3D{0%{transform:rotateZ(-18deg) rotateY(-20deg) scale(1.2)}25%{transform:rotateZ(18deg) rotateY(20deg) scale(1.35)}50%{transform:rotateZ(-15deg) rotateY(-15deg) scale(1.3)}75%{transform:rotateZ(15deg) rotateY(15deg) scale(1.35)}100%{transform:rotateZ(-18deg) rotateY(-20deg) scale(1.2)}}
.tabs{display:flex;gap:10px;overflow-x:auto;padding:14px 18px;white-space:nowrap;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{height:38px;border-radius:999px;border:1px solid #e5e7eb;background:white;display:flex;align-items:center;gap:8px;padding:0 14px;font-size:13px;font-weight:600;color:#334155;cursor:pointer;flex-shrink:0}
.tab.active{background:#E30613;color:white;border-color:#E30613}
.tab .num{background:#f1f5f9;color:#334155;min-width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700}
.tab.active .num{background:white;color:#E30613}
.tab svg{width:18px;height:18px;flex-shrink:0}
.container{padding:0 18px 30px}
.card{background:white;border-radius:14px;border:1px solid #e8edf5;padding:12px 14px;display:grid;grid-template-columns:200px 210px 170px 150px 190px 140px;gap:10px;align-items:start;margin-bottom:12px;box-shadow:0 2px 10px rgba(0,0,0,.04)}
.card-top{grid-column:1 / -1;display:flex;gap:8px;margin-bottom:2px}
.badge-id{background:#E30613;color:white;border-radius:999px;padding:4px 12px;font-size:11px;font-weight:800}
.badge-estado{background:#E30613;color:white;border-radius:999px;padding:4px 12px;font-size:11px;font-weight:700}
.col{display:flex;flex-direction:column;gap:4px}
.shop{display:flex;gap:10px}
.shop-icon{width:52px;height:52px;background:#C00612;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:white;font-weight:800;font-size:10px;text-align:center;line-height:1}
.shop-name{font-size:13px;font-weight:700;color:#111}
.shop-sub{font-size:11px;color:#64748b}
.recoger{margin-top:6px;display:flex;flex-direction:column;gap:2px}
.recoger b{font-size:11px;display:flex;align-items:center;gap:4px;color:#111}
.recoger span{font-size:11px;color:#5b708a;line-height:1.2}
.actions-row{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.btn-pill{border:1px solid #e2e8f0;border-radius:999px;padding:6px 10px;font-size:10px;font-weight:600;display:flex;align-items:center;gap:4px;cursor:pointer;background:white;color:#334155}
.btn-pill.red{color:#E30613;border-color:#fecdd3;background:#fff1f2}
.btn-pill.dark{background:#0f172a;color:white;border-color:#0f172a}
.btn-pill.green{background:#E30613;color:white;border-color:#E30613}
.cliente b{font-size:11px;color:#111;display:flex;align-items:center;gap:6px}
.cliente .name{font-size:11px;color:#475569;margin-left:20px}
.cliente .tel{font-size:11px;color:#5b708a;display:flex;align-items:center;gap:4px;margin-left:20px}
.btn-map{margin-left:20px;margin-top:6px;border:1px solid #fecdd3;background:#fff1f2;color:#E30613;border-radius:999px;padding:5px 10px;font-size:10px;font-weight:600;display:inline-flex;align-items:center;gap:4px;cursor:pointer}
.prod b{font-size:11px;color:#111;display:flex;align-items:center;gap:6px}
.prod-list{margin-left:22px;margin-top:4px;display:flex;flex-direction:column;gap:2px}
.prod-list div{display:flex;justify-content:space-between;font-size:11px;color:#5b708a}
.tot b{font-size:11px;color:#475569;display:flex;align-items:center;gap:6px}
.tot .val{font-size:14px;font-weight:800;color:#111;margin-left:22px}
.tot .ship{font-size:11px;color:#475569;margin-left:22px;margin-top:4px;display:flex;align-items:center;gap:6px}
.tot .total{margin-left:22px;margin-top:8px;border-top:1px solid #e5e7eb;padding-top:6px}
.tot .total small{font-size:11px;color:#111;display:block}
.tot .total strong{font-size:18px;color:#E30613;font-weight:800}
.entrega b{font-size:11px;color:#111;display:flex;align-items:center;gap:6px}
.entrega span{font-size:11px;color:#5b708a;margin-left:20px;line-height:1.3;display:block}
.entrega .hora{margin-top:10px;display:flex;align-items:center;gap:6px;font-size:11px;color:#475569;margin-left:20px}
.side{display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.badge-nuevo{background:#E30613;color:white;border-radius:999px;padding:4px 12px;font-size:10px;font-weight:700}
.btn-entregado{background:#16a34a;color:white;border:none;border-radius:10px;padding:9px 16px;font-size:11px;font-weight:700;display:flex;align-items:center;gap:6px;cursor:pointer;width:100%;justify-content:center}
.btn-cancelado{background:white;border:1px solid #cbd5e1;border-radius:10px;padding:8px 16px;font-size:11px;font-weight:600;display:flex;align-items:center;gap:6px;cursor:pointer;width:100%;justify-content:center;color:#334155}
@media(max-width:980px){
  .card{grid-template-columns:1fr 1fr;gap:14px}
  .side{grid-column:1 / -1;flex-direction:row;justify-content:space-between;align-items:center}
  .side .btn-entregado,.side .btn-cancelado{width:auto}
}
@media(max-width:640px){
  .header h1{font-size:22px}
  .tabs{padding:10px 12px}
  .container{padding:0 10px 90px}
  .card{grid-template-columns:1fr;gap:12px;padding:12px}
  .shop-icon{width:48px;height:48px}
  .actions-row{gap:6px}
  .side{flex-direction:column;align-items:stretch}
}
</style>
</head>
<body>

<div class="header">
  <div class="left">
    <button class="btn-x" onclick="window.location.href='panelrepa.html'">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke-width="3" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
    <h1>Pedidos</h1>
  </div>
  <div class="right">
    <div class="bell" id="bell">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#E30613" stroke-width="2"><path d="M6 8a6 6 0 0 1 12 0c0 7 6 5 6 9H0s6-2 6-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
      <span class="bell-count" id="bellCount">3</span>
    </div>
  </div>
</div>

<div class="tabs" id="tabs">
  <div class="tab active" data-f="activo" onclick="filtrar('activo')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 17a2 2 0 1 0 0 4 2 2 0 0 0 0-4zm12 0a2 2 0 1 0 0 4 2 2 0 0 0 0-4z"/><path d="M5 17l2-6h8l2 6"/><circle cx="7" cy="7" r="2"/><path d="M7 5a3 3 0 0 1 3 3"/></svg>
    Activo <span class="num" id="c-activo">0</span>
  </div>
  <div class="tab" data-f="ir_a_recoger" onclick="filtrar('ir_a_recoger')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1"/><line x1="9" y1="12" x2="15" y2="12"/><line x1="9" y1="16" x2="15" y2="16"/></svg>
    Ir a recoger <span class="num" id="c-ir_a_recoger">0</span>
  </div>
  <div class="tab" data-f="recogido" onclick="filtrar('recogido')">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-8 9z"/></svg>
    Recogido <span class="num" id="c-recogido">0</span>
  </div>
  <div class="tab" data-f="ir_a_entregar" onclick="filtrar('ir_a_entregar')">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M20 8h-3V4H3v13h2a3 3 0 0 0 6 0h2a3 3 0 0 0 6 0h2v-5l-3-4zM5 18a1 1 0 1 1 0-2 1 1 0 0 1 0 2zm12 0a1 1 0 1 1 0-2 1 1 0 0 1 0 2z"/></svg>
    Ir a entregar <span class="num" id="c-ir_a_entregar">0</span>
  </div>
  <div class="tab" data-f="entregado" onclick="filtrar('entregado')">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-8 9z"/></svg>
    Entregado <span class="num" id="c-entregado">0</span>
  </div>
  <div class="tab" data-f="cancelado" onclick="filtrar('cancelado')">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10 10-4.5 10-10S17.5 2 12 2zm3.7 14.3L12 13.4l-3.7 2.9-.7-.9L11.3 12 7.6 9.1l.7-.9L12 11.1l3.7-2.9.7.9L12.7 12l3.7 2.9-.7.9z"/></svg>
    Cancelado <span class="num" id="c-cancelado">0</span>
  </div>
</div>

<div class="container" id="lista"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import { getFirestore, collection, onSnapshot, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

const configAdmin = {
  apiKey: "AIzaSyDLKngPyi_SWAXEQwdrHO5h8L8OufulAR4",
  authDomain: "doloya-confirmacion.firebaseapp.com",
  projectId: "doloya-confirmacion",
  storageBucket: "doloya-confirmacion.firebasestorage.app",
  messagingSenderId: "832228761099",
  appId: "1:832228761099:web:ddd4b6a0ee0d7f0494b10e"
};
const app = initializeApp(configAdmin);
const db = getFirestore(app);

let sesion = JSON.parse(localStorage.getItem("repartidor_sesion")||'{"usuario":"Jose","nombre":"Jose"}');
let filtro = "activo";
let pedidos = [];
let ultimoCount = 0;
let primero = true;

function sonarDoloYa(){
  const bell = document.getElementById('bell');
  bell.classList.add('vibrar');
  setTimeout(()=>bell.classList.remove('vibrar'), 3000);
  try{
    const ctx = new (window.AudioContext||window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type='sine';
    osc.frequency.setValueAtTime(880, ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(1200, ctx.currentTime+0.15);
    osc.frequency.exponentialRampToValueAtTime(700, ctx.currentTime+0.5);
    gain.gain.setValueAtTime(0.9, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime+0.7);
    osc.connect(gain); gain.connect(ctx.destination);
    osc.start(); osc.stop(ctx.currentTime+0.7);
  }catch{}
  try{
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance("Nuevo pedido DoloYa");
    u.lang='es-MX'; u.rate=1.1;
    speechSynthesis.speak(u);
  }catch{}
}

function mapEstado(p){
  const e = p.estado||'';
  if(['enviado_a_repartidor','activo','nuevo','pendiente'].includes(e)) return 'activo';
  if(['aceptado','ir_a_recoger'].includes(e)) return 'ir_a_recoger';
  if(['recogido'].includes(e)) return 'recogido';
  if(['en_camino','ir_a_entregar'].includes(e)) return 'ir_a_entregar';
  if(['entregado','finalizado'].includes(e)) return 'entregado';
  if(['cancelado'].includes(e)) return 'cancelado';
  return 'activo';
}

function render(){
  const mios = pedidos.filter(p=> !p.repartidorId || p.repartidorId===sesion.usuario || p.repartidorId==='Jose' || p.repartidorNombre===sesion.nombre || p.repartidorNombre==='Jose');
  
  const counts = {activo:0, ir_a_recoger:0, recogido:0, ir_a_entregar:0, entregado:0, cancelado:0};
  mios.forEach(p=>{ const m=mapEstado(p); if(counts[m]!==undefined) counts[m]++; });
  
  document.getElementById('c-activo').textContent=counts.activo;
  document.getElementById('c-ir_a_recoger').textContent=counts.ir_a_recoger;
  document.getElementById('c-recogido').textContent=counts.recogido;
  document.getElementById('c-ir_a_entregar').textContent=counts.ir_a_entregar;
  document.getElementById('c-entregado').textContent=counts.entregado;
  document.getElementById('c-cancelado').textContent=counts.cancelado;
  document.getElementById('bellCount').textContent=counts.activo+counts.ir_a_recoger;

  if(!primero && (counts.activo+counts.ir_a_recoger)>ultimoCount) sonarDoloYa();
  ultimoCount = counts.activo+counts.ir_a_recoger;
  primero=false;

  const filtrados = mios.filter(p=> mapEstado(p)===filtro);
  const lista = document.getElementById('lista');
  
  if(filtrados.length===0){
    lista.innerHTML=`<div style="text-align:center;padding:60px 20px;color:#64748b;font-weight:600">No hay pedidos en ${filtro.replace(/_/g,' ')}</div>`;
    return;
  }

  lista.innerHTML = filtrados.map(p=>{
    const id = (p.codigo||p.id||'0015').toString().slice(-4).toUpperCase();
    const cliente = p.nombre||p.detalles?.nombre||'Carlos Gómez';
    const tel = p.telefono||p.detalles?.telefono||'+52 477 123 4567';
    const rest = p.restaurante?.nombre||p.restauranteNombre||'Burger House';
    const sub = p.restaurante?.categoria||'Comida rápida';
    const dirRec = p.restaurante?.direccion||'Av. Hidalgo #198';
    const colRec = p.restaurante?.colonia||'Col. Centro, Dolores Hidalgo, Gto.';
    const dirEnt = p.detalles?.direccion||'Calle Independencia #124';
    const colEnt = p.detalles?.colonia||'Col. Centro, Dolores Hidalgo, Gto.';
    const hora = p.fechaHora||'Hoy, 12:34 p.m.';
    const prods = p.productos||p.items||[{nombre:'Hamburguesa clásica', cant:1},{nombre:'Papas a la francesa', cant:1},{nombre:'Refresco 600 ml', cant:1}];
    const totalPedido = p.totales?.totalProductos||p.total||89;
    const envio = p.totales?.envio||25;
    const total = p.totales?.total||114;

    return `
    <div class="card">
      <div class="card-top">
        <span class="badge-id">#${id}</span>
        <span class="badge-estado">${filtro==='activo'?'Activo':filtro.replace(/_/g,' ')}</span>
      </div>

      <div class="col">
        <div class="shop">
          <div class="shop-icon">Burger<br>House</div>
          <div>
            <div class="shop-name">${rest}</div>
            <div class="shop-sub">${sub}</div>
          </div>
        </div>
        <div class="recoger">
          <b><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="2"><path d="M20 10c0 6-8 12-8 12S4 16 4 10a8 8 0 0 1 16 0z"/><circle cx="12" cy="10" r="3"/></svg> Recoger en:</b>
          <span style="display:flex;gap:4px"><svg width="12" height="12" viewBox="0 0 24 24" fill="#111"><path d="M12 2C8 2 4 5 4 10c0 5 8 12 8 12s8-7 8-12c0-5-4-8-8-8zm0 11a3 3 0 1 1 0-6 3 3 0 0 1 0 6z"/></svg> ${dirRec}<br>${colRec}</span>
        </div>
        <div class="actions-row">
          <button class="btn-pill red" onclick="irRecoger('${dirRec}')"><svg width="12" height="12" viewBox="0 0 24 24" fill="#E30613"><path d="M12 2C8 2 4 5 4 10c0 5 8 12 8 12s8-7 8-12c0-5-4-8-8-8zm0 11a3 3 0 1 1 0-6 3 3 0 0 1 0 6z"/></svg> Ir a recoger</button>
          <button class="btn-pill" onclick="accion('${p.id}','recogido')"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#334155" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg> Recogido</button>
        </div>
      </div>

      <div class="col cliente">
        <b><svg width="14" height="14" viewBox="0 0 24 24" fill="#111"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 4-7 8-7s8 3 8 7"/></svg> Cliente:</b>
        <div class="name">${cliente}</div>
        <div class="tel"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#5b708a" stroke-width="2"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6 19.8 19.8 0 0 1-3.1-8.7A2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 2 .8 2.9a2 2 0 0 1-.5 2.1L9 10a16 16 0 0 0 5 5l1.3-1.3a2 2 0 0 1 2.1-.5c.9.4 1.9.7 2.9.8a2 2 0 0 1 1.7 2z"/></svg> ${tel}</div>
        <button class="btn-map" onclick="openMaps('${dirEnt}')"><svg width="12" height="12" viewBox="0 0 24 24" fill="#E30613"><path d="M12 2C8 2 4 5 4 10c0 5 8 12 8 12s8-7 8-12c0-5-4-8-8-8zm0 11a3 3 0 1 1 0-6 3 3 0 0 1 0 6z"/></svg> Ir a Google Maps</button>
        <div class="actions-row" style="margin-left:20px;margin-top:8px">
          <button class="btn-pill green" onclick="accion('${p.id}','recogido')"><svg width="12" height="12" viewBox="0 0 24 24" fill="white"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-8 9z"/></svg> Recogido</button>
          <button class="btn-pill" onclick="llamar('${tel}')"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#334155" stroke-width="2"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6 19.8 19.8 0 0 1-3.1-8.7A2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 2 .8 2.9a2 2 0 0 1-.5 2.1L9 10a16 16 0 0 0 5 5l1.3-1.3a2 2 0 0 1 2.1-.5c.9.4 1.9.7 2.9.8a2 2 0 0 1 1.7 2z"/></svg> Llamar al cliente</button>
        </div>
      </div>

      <div class="col prod">
        <b><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="2"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg> Productos:</b>
        <div class="prod-list">
          ${prods.map(pr=>`<div><span>${pr.nombre||pr.name||'Producto'}</span><span>x${pr.cant||pr.cantidad||1}</span></div>`).join('')}
        </div>
      </div>

      <div class="col tot">
        <b><svg width="14" height="14" viewBox="0 0 24 24" fill="#111"><circle cx="12" cy="12" r="10"/><path d="M12 6v2M12 14v4M9 10a3 3 0 1 0 6 0 3 3 0 0 0-6 0z" fill="none" stroke="white" stroke-width="1.5"/></svg> Total del pedido</b>
        <div class="val">$${totalPedido} MXN</div>
        <div class="ship"><svg width="14" height="14" viewBox="0 0 24 24" fill="#111"><path d="M20 8h-3V4H3v13h2a3 3 0 0 0 6 0h2a3 3 0 0 0 6 0h2v-5l-3-4zM5 18a1 1 0 1 1 0-2 1 1 0 0 1 0 2zm12 0a1 1 0 1 1 0-2 1 1 0 0 1 0 2z"/></svg> Envío<br>$${envio} MXN</div>
        <div class="total"><small>Total</small><strong>$${total} MXN</strong></div>
      </div>

      <div class="col entrega">
        <b><svg width="14" height="14" viewBox="0 0 24 24" fill="#111"><path d="M12 2C8 2 4 5 4 10c0 5 8 12 8 12s8-7 8-12c0-5-4-8-8-8zm0 11a3 3 0 1 1 0-6 3 3 0 0 1 0 6z"/></svg> Entrega en:</b>
        <span>${dirEnt}<br>${colEnt}</span>
        <div class="hora"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="2"><circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15 15"/></svg> ${hora}</div>
      </div>

      <div class="col side">
        <span class="badge-nuevo">Nuevo</span>
        <button class="btn-entregado" onclick="accion('${p.id}','entregado')"><svg width="14" height="14" viewBox="0 0 24 24" fill="white"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-8 9z"/></svg> Entregado</button>
        <button class="btn-cancelado" onclick="accion('${p.id}','cancelado')"><svg width="14" height="14" viewBox="0 0 24 24" fill="#475569"><path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10 10-4.5 10-10S17.5 2 12 2zm3.7 14.3L12 13.4l-3.7 2.9-.7-.9L11.3 12 7.6 9.1l.7-.9L12 11.1l3.7-2.9.7.9L12.7 12l3.7 2.9-.7.9z"/></svg> Cancelado</button>
      </div>
    </div>
    `;
  }).join('');
}

window.filtrar = (f)=>{
  filtro=f;
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active', t.dataset.f===f));
  render();
}

window.accion = async (id, estado)=>{
  let real = estado;
  if(estado==='activo') real='enviado_a_repartidor';
  if(estado==='ir_a_recoger') real='ir_a_recoger';
  if(estado==='recogido') real='recogido';
  if(estado==='ir_a_entregar') real='en_camino';
  if(estado==='entregado') real='finalizado';
  try{ await updateDoc(doc(db,"pedidos_admin",id),{estado:real}); }catch(e){ alert(e.message); }
}
window.irRecoger = (dir)=>{ window.open(`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(dir)}`,'_blank'); }
window.openMaps = (dir)=>{ window.open(`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(dir)}`,'_blank'); }
window.llamar = (tel)=>{ window.location.href=`tel:${tel}`; }

onSnapshot(collection(db,"pedidos_admin"), (snap)=>{
  pedidos = snap.docs.map(d=>({id:d.id, ...d.data()}));
  render();
});
</script>
</body>
</html>
