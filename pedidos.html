<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pedidos - DoloYa Repartidor</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif}
body{background:#f6f8fb;min-height:100vh}
.header{height:64px;background:white;display:flex;align-items:center;justify-content:space-between;padding:0 18px;border-bottom:1px solid #e5e7eb;position:sticky;top:0;z-index:10}
.left{display:flex;align-items:center;gap:14px}
.btn-x{width:36px;height:36px;background:#E30613;border-radius:50%;display:flex;align-items:center;justify-content:center;border:none;cursor:pointer}
.btn-x svg{stroke:white}
.header h1{font-size:28px;font-weight:800;color:#111}
.right{position:relative}
.bell{width:38px;height:38px;display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative}
.bell-count{position:absolute;top:-4px;right:-4px;background:#E30613;color:white;min-width:20px;height:20px;border-radius:50%;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;border:2px solid white}
.bell.vibrar{animation:bell3D .12s infinite;transform-style:preserve-3d}
@keyframes bell3D{0%{transform:rotateZ(-18deg) rotateY(-20deg) scale(1.2)}25%{transform:rotateZ(18deg) rotateY(20deg) scale(1.35)}50%{transform:rotateZ(-15deg) rotateY(-15deg) scale(1.3)}75%{transform:rotateZ(15deg) rotateY(15deg) scale(1.35)}100%{transform:rotateZ(-18deg) rotateY(-20deg) scale(1.2)}}
.tabs{display:flex;gap:10px;overflow-x:auto;padding:14px 18px;white-space:nowrap;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{height:38px;border-radius:999px;border:1px solid #e5e7eb;background:white;display:flex;align-items:center;gap:8px;padding:0 14px;font-size:13px;font-weight:600;color:#334155;cursor:pointer;flex-shrink:0}
.tab.active{background:#E30613;color:white;border-color:#E30613}
.tab .num{background:#f1f5f9;color:#334155;min-width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700}
.tab.active .num{background:white;color:#E30613}
.container{padding:0 18px 30px}
.card{background:white;border-radius:14px;border:1px solid #e8edf5;padding:12px 14px;display:grid;grid-template-columns:200px 210px 170px 150px 190px;gap:10px;align-items:start;margin-bottom:12px;box-shadow:0 2px 10px rgba(0,0,0,.04)}
.card-top{grid-column:1 / -1;display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:4px}
.badge-id{background:#E30613;color:white;border-radius:999px;padding:4px 12px;font-size:11px;font-weight:800}
.top-right{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.time-row{display:flex;align-items:center;gap:8px;font-size:11px;color:#334155;font-weight:600}
.tiempo-real{border-radius:999px;padding:3px 10px;font-size:10px;font-weight:900;display:inline-flex;align-items:center;gap:4px;color:white}
.tiempo-verde{background:#16a34a}
.tiempo-amarillo{background:#EAB308}
.tiempo-rojo{background:#EF4444}
.map-btns{display:flex;flex-direction:column;gap:4px;align-items:flex-end}
.btn-mini-map{border:1px solid #e2e8f0;border-radius:999px;padding:4px 10px;font-size:9px;font-weight:600;display:flex;align-items:center;gap:4px;cursor:pointer;background:white;color:#334155}
.btn-mini-map.recogida{color:#E30613;border-color:#fecdd3;background:#fff1f2}
.btn-mini-map.entrega{background:#0f172a;color:white;border-color:#0f172a}
.col{display:flex;flex-direction:column;gap:4px}
.shop{display:flex;gap:10px}
.shop-icon{width:52px;height:52px;background:#f1f5f9;border:2px solid #e5e7eb;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;overflow:hidden}
.shop-icon img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.shop-name{font-size:13px;font-weight:700;color:#111}
.shop-sub{font-size:11px;color:#64748b}
.recoger b,.cliente b,.prod b,.tot b,.entrega b{font-size:11px;color:#111;display:flex;align-items:center;gap:4px}
.recoger span,.cliente .name,.entrega span{font-size:11px;color:#5b708a;line-height:1.2;display:block}
.cliente .tel{font-size:11px;color:#5b708a;display:flex;align-items:center;gap:4px}
.prod-list{margin-left:0;margin-top:4px;display:flex;flex-direction:column;gap:2px}
.prod-list div{display:flex;justify-content:space-between;font-size:11px;color:#5b708a}
.tot .val{font-size:14px;font-weight:800;color:#111}
.tot .ship{font-size:11px;color:#475569;margin-top:4px}
.tot .total{margin-top:8px;border-top:1px solid #e5e7eb;padding-top:6px}
.tot .total small{font-size:11px;color:#111;display:block}
.tot .total strong{font-size:18px;color:#E30613;font-weight:800}
.card-bottom{grid-column:1 / -1;display:flex;gap:8px;padding-top:10px;border-top:1px solid #f1f5f9;margin-top:4px;flex-wrap:wrap}
.btn-bottom{border-radius:10px;padding:9px 14px;font-size:11px;font-weight:700;display:flex;align-items:center;gap:6px;cursor:pointer;flex:1;justify-content:center;min-width:100px;border:1px solid #e2e8f0}
.btn-bottom.recoger{background:#fff1f2;color:#E30613;border-color:#fecdd3}
.btn-bottom.tengo{background:white;color:#334155}
.btn-bottom.entregar{background:#0f172a;color:white;border-color:#0f172a}
.btn-bottom.entregado{background:#16a34a;color:white;border-color:#16a34a}
.btn-bottom.cancelado{background:white;color:#64748b;border-color:#cbd5e1}
@media(max-width:980px){.card{grid-template-columns:1fr 1fr;gap:14px}.card-bottom{flex-wrap:wrap}}
@media(max-width:640px){.card{grid-template-columns:1fr}.card-bottom{display:grid;grid-template-columns:1fr 1fr;gap:8px}.btn-bottom.cancelado{grid-column:1 / -1}}
</style>
</head>
<body>

<div class="header">
  <div class="left">
    <button class="btn-x" onclick="window.location.href='panelrepa.html'"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke-width="3" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    <h1>Pedidos</h1>
  </div>
  <div class="right"><div class="bell" id="bell"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#E30613" stroke-width="2"><path d="M6 8a6 6 0 0 1 12 0c0 7 6 5 6 9H0s6-2 6-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg><span class="bell-count" id="bellCount">0</span></div></div>
</div>

<div class="tabs">
  <div class="tab active" data-f="activo" onclick="filtrar('activo')">Activo <span class="num" id="c-activo">0</span></div>
  <div class="tab" data-f="ir_a_recoger" onclick="filtrar('ir_a_recoger')">Ir a recoger <span class="num" id="c-ir_a_recoger">0</span></div>
  <div class="tab" data-f="recogido" onclick="filtrar('recogido')">Recogido <span class="num" id="c-recogido">0</span></div>
  <div class="tab" data-f="ir_a_entregar" onclick="filtrar('ir_a_entregar')">Ir a entregar <span class="num" id="c-ir_a_entregar">0</span></div>
  <div class="tab" data-f="entregado" onclick="filtrar('entregado')">Entregado <span class="num" id="c-entregado">0</span></div>
  <div class="tab" data-f="cancelado" onclick="filtrar('cancelado')">Cancelado <span class="num" id="c-cancelado">0</span></div>
</div>

<div class="container" id="lista"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import { getFirestore, collection, onSnapshot, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

const configAdmin = {
  apiKey: "AIzaSyDLKngPyi_SWAXEQwdrHO5h8L8OufulAR4",
  authDomain: "doloya-confirmacion.firebaseapp.com",
  projectId: "doloya-confirmacion",
  storageBucket: "doloya-confirmacion.firebasestorage.app",
  messagingSenderId: "832228761099",
  appId: "1:832228761099:web:ddd4b6a0ee0d7f0494b10e"
};
const app = initializeApp(configAdmin);
const db = getFirestore(app);

let sesion = JSON.parse(localStorage.getItem("repartidor_sesion")||'{"usuario":"Jose","nombre":"Jose"}');
let filtro = "activo";
let pedidos = [];
let ultimoCount = 0;
let primero = true;

function calcularTiempoReal(sec){
  if(!sec) return {texto:'0s', clase:'tiempo-verde'};
  const diff=Math.floor(Date.now()/1000-sec);
  const min=Math.floor(diff/60); const seg=diff%60;
  let texto=''; if(diff<60) texto=diff+'s'; else if(diff<3600) texto=min+'m '+seg+'s'; else {const h=Math.floor(min/60); const m=min%60; texto=h+'h '+m+'m';}
  let clase='tiempo-verde'; if(diff<840) clase='tiempo-verde'; else if(diff<1080) clase='tiempo-amarillo'; else clase='tiempo-rojo';
  return {texto, clase};
}

function sonarDoloYa(){
  const bell = document.getElementById('bell');
  bell.classList.add('vibrar');
  setTimeout(()=>bell.classList.remove('vibrar'), 3800);
  try{
    const ctx = new (window.AudioContext||window.webkitAudioContext)();
    ctx.resume();
    const osc1 = ctx.createOscillator(); const osc2 = ctx.createOscillator(); const gain = ctx.createGain();
    osc1.type='sine'; osc2.type='triangle';
    osc1.frequency.setValueAtTime(900, ctx.currentTime);
    osc1.frequency.linearRampToValueAtTime(1400, ctx.currentTime+0.2);
    osc1.frequency.linearRampToValueAtTime(800, ctx.currentTime+0.6);
    osc2.frequency.setValueAtTime(450, ctx.currentTime);
    gain.gain.setValueAtTime(0.9, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime+0.8);
    osc1.connect(gain); osc2.connect(gain); gain.connect(ctx.destination);
    osc1.start(); osc2.start(); osc1.stop(ctx.currentTime+0.8); osc2.stop(ctx.currentTime+0.8);
  }catch{}
  try{ const audio=new Audio("https://actions.google.com/sounds/v1/alarms/beep_short.ogg"); audio.volume=1; audio.play().catch(()=>{});}catch{}
  try{ speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance("Nuevo pedido DoloYa asignado"); u.lang='es-MX'; u.volume=1; speechSynthesis.speak(u);}catch{}
}

function mapEstado(p){
  const e = (p.estado||'').toLowerCase();
  if(['enviado_a_repartidor','activo','nuevo','pendiente'].includes(e)) return 'activo';
  if(['aceptado','ir_a_recoger'].includes(e)) return 'ir_a_recoger';
  if(['recogido'].includes(e)) return 'recogido';
  if(['en_camino','ir_a_entregar'].includes(e)) return 'ir_a_entregar';
  if(['entregado','finalizado'].includes(e)) return 'entregado';
  if(['cancelado'].includes(e)) return 'cancelado';
  return 'activo';
}

function render(){
  const mios = pedidos.filter(p=>{
    const esDeJose = p.repartidorId===sesion.usuario || p.repartidorId==='Jose' || p.repartidorNombre===sesion.nombre || p.repartidorNombre==='Jose';
    const yaFueEnviado = !['nuevo','listo_para_admin','listo','sin_enviar','',undefined].includes(p.estado);
    return esDeJose && yaFueEnviado;
  });
  
  const counts = {activo:0, ir_a_recoger:0, recogido:0, ir_a_entregar:0, entregado:0, cancelado:0};
  mios.forEach(p=>{ const m=mapEstado(p); if(counts[m]!==undefined) counts[m]++; });
  
  document.getElementById('c-activo').textContent=counts.activo;
  document.getElementById('c-ir_a_recoger').textContent=counts.ir_a_recoger;
  document.getElementById('c-recogido').textContent=counts.recogido;
  document.getElementById('c-ir_a_entregar').textContent=counts.ir_a_entregar;
  document.getElementById('c-entregado').textContent=counts.entregado;
  document.getElementById('c-cancelado').textContent=counts.cancelado;
  document.getElementById('bellCount').textContent=counts.activo+counts.ir_a_recoger;

  if(!primero && (counts.activo+counts.ir_a_recoger)>ultimoCount) sonarDoloYa();
  ultimoCount = counts.activo+counts.ir_a_recoger;
  primero=false;

  const filtrados = mios.filter(p=> mapEstado(p)===filtro);
  const lista = document.getElementById('lista');
  
  if(filtrados.length===0){
    lista.innerHTML=`<div style="text-align:center;padding:60px 20px;color:#64748b;font-weight:600">No hay pedidos en ${filtro.replace(/_/g,' ')}</div>`;
    return;
  }

  lista.innerHTML = filtrados.map(p=>{
    const codigoReal = p.codigo || p.id;
    const cliente = p.cliente?.nombre || p.nombre || p.detalles?.nombre || 'Cliente';
    const celular = p.cliente?.celular || p.telefono || '';
    const restNombre = p.restaurante?.nombre || p.tienda?.nombre || 'Burger House';
    const restCat = p.restaurante?.categoria || 'Comida rápida';
    const restLogo = p.restaurante?.logo || p.tienda?.logo || p.restaurante?.imagen || '';
    const dirRecoger = p.restaurante?.direccion || p.tienda?.direccion || 'Av. Hidalgo #198';
    const colRecoger = p.restaurante?.colonia || 'Col. Centro, Dolores Hidalgo, Gto.';
    const dirEntrega = p.cliente?.direccion || p.direccionEntrega || 'Calle Independencia #124';
    const colEntrega = p.cliente?.colonia || 'Col. Centro';
    const prods = p.productos || [];
    const totalProductos = p.totales?.costoProductos ?? 89;
    const costoEnvio = p.totales?.costoEnvio ?? 25;
    const totalFinal = p.totales?.total ?? (Number(totalProductos)+Number(costoEnvio));
    
    let tsSec=0; let horaStr='12:34 p.m.';
    if(p.enviadoARepartidorEn?.seconds) tsSec=p.enviadoARepartidorEn.seconds;
    else if(p.timestamp?.seconds) tsSec=p.timestamp.seconds;
    else if(p.timestampAdmin?.seconds) tsSec=p.timestampAdmin.seconds;
    if(tsSec) horaStr=new Date(tsSec*1000).toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit'});
    const tiempo = calcularTiempoReal(tsSec);

    return `
    <div class="card">
      <div class="card-top">
        <span class="badge-id">#${codigoReal}</span>
        <div class="top-right">
          <div class="time-row"><span>${horaStr}</span><span class="tiempo-real ${tiempo.clase}" data-ts="${tsSec}">${tiempo.texto}</span></div>
          <div class="map-btns">
            <button class="btn-mini-map recogida" onclick="irRecoger('${dirRecoger}')"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13S3 17 3 10a9 9 0 0 1 18 0z"/></svg> Mapa de recogida</button>
            <button class="btn-mini-map entrega" onclick="openMaps('${dirEntrega}')"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"/></svg> Mapa de entrega</button>
          </div>
        </div>
      </div>
      <div class="col">
        <div class="shop"><div class="shop-icon">${restLogo ? `<img src="${restLogo}">` : `LOGO`}</div><div><div class="shop-name">${restNombre}</div><div class="shop-sub">${restCat}</div></div></div>
        <div class="recoger"><b>Recoger en:</b><span>${dirRecoger}<br>${colRecoger}</span></div>
      </div>
      <div class="col cliente"><b>Cliente:</b><div class="name">${cliente}</div><div class="tel">${celular}</div></div>
      <div class="col prod"><b>Productos:</b><div class="prod-list">${prods.length>0 ? prods.map(pr=>`<div><span>${pr.nombre||pr.name}</span><span>x${pr.cantidad||1}</span></div>`).join('') : `<div><span>Hamburguesa clásica</span><span>x1</span></div>`}</div></div>
      <div class="col tot"><b>Total del pedido</b><div class="val">$${totalProductos} MXN</div><div class="ship">Envío<br>$${costoEnvio} MXN</div><div class="total"><small>Total</small><strong>$${totalFinal} MXN</strong></div></div>
      <div class="col entrega"><b>Entrega en:</b><span>${dirEntrega}<br>${colEntrega}</span></div>
      
      <div class="card-bottom">
        <button class="btn-bottom recoger" onclick="accion('${p.id}','ir_a_recoger')"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13S3 17 3 10a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg> Ir a recoger</button>
        <button class="btn-bottom tengo" onclick="accion('${p.id}','recogido')"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2"/></svg> Lo tengo</button>
        <button class="btn-bottom entregar" onclick="accion('${p.id}','ir_a_entregar')"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="5.5" cy="17.5" r="3.5"/><circle cx="18.5" cy="17.5" r="3.5"/><path d="M5 17h13l2-7H8"/></svg> Ir a entregar</button>
        <button class="btn-bottom entregado" onclick="accion('${p.id}','entregado')"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><path d="M20 6L9 17l-5-5"/></svg> Entregado</button>
        <button class="btn-bottom cancelado" onclick="accion('${p.id}','cancelado')"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg> Cancelado</button>
      </div>
    </div>`;
  }).join('');
}

window.filtrar = (f)=>{ filtro=f; document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active', t.dataset.f===f)); render(); }
window.accion = async (id, estado)=>{
  let real = estado;
  if(estado==='ir_a_recoger') real='ir_a_recoger';
  if(estado==='recogido') real='recogido';
  if(estado==='ir_a_entregar') real='en_camino';
  if(estado==='entregado') real='finalizado';
  if(estado==='cancelado') real='cancelado';
  try{ await updateDoc(doc(db,"pedidos_admin",id),{estado:real, actualizadoEn:new Date().toISOString()}); }catch(e){ alert(e.message); }
}
window.irRecoger = (dir)=>{ window.open(`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(dir)}`,'_blank'); }
window.openMaps = (dir)=>{ window.open(`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(dir)}`,'_blank'); }

setInterval(()=>{
  document.querySelectorAll('.tiempo-real').forEach(el=>{
    const ts=parseInt(el.dataset.ts||0); if(ts){ const t=calcularTiempoReal(ts); el.textContent=t.texto; el.className='tiempo-real '+t.clase; }
  });
},1000);

document.addEventListener('click', function unlock(){ try{ const ctx=new (window.AudioContext||window.webkitAudioContext)(); ctx.resume(); }catch{}; document.removeEventListener('click', unlock); }, {once:true});

onSnapshot(collection(db,"pedidos_admin"), (snap)=>{
  pedidos = snap.docs.map(d=>({id:d.id, ...d.data()}));
  render();
});
</script>
</body>
</html>
