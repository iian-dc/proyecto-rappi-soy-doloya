<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pedidos - DoloYa Repartidor</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif}
body{background:#f6f8fb;min-height:100vh}
.header{height:64px;background:white;display:flex;align-items:center;justify-content:space-between;padding:0 18px;border-bottom:1px solid #e5e7eb;position:sticky;top:0;z-index:10}
.left{display:flex;align-items:center;gap:14px}
.btn-x{width:36px;height:36px;background:#E30613;border-radius:50%;display:flex;align-items:center;justify-content:center;border:none;cursor:pointer}
.btn-x svg{stroke:white}
.header h1{font-size:28px;font-weight:800;color:#111}
.right{position:relative}
.bell{width:38px;height:38px;display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative}
.bell-count{position:absolute;top:-4px;right:-4px;background:#E30613;color:white;min-width:20px;height:20px;border-radius:50%;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;border:2px solid white}
.bell.vibrar{animation:bell3D .12s infinite;transform-style:preserve-3d}
@keyframes bell3D{0%{transform:rotateZ(-18deg) rotateY(-20deg) scale(1.2)}25%{transform:rotateZ(18deg) rotateY(20deg) scale(1.35)}50%{transform:rotateZ(-15deg) rotateY(-15deg) scale(1.3)}75%{transform:rotateZ(15deg) rotateY(15deg) scale(1.35)}100%{transform:rotateZ(-18deg) rotateY(-20deg) scale(1.2)}}
.tabs{display:flex;gap:10px;overflow-x:auto;padding:14px 18px;white-space:nowrap;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{height:38px;border-radius:999px;border:1px solid #e5e7eb;background:white;display:flex;align-items:center;gap:8px;padding:0 14px;font-size:13px;font-weight:600;color:#334155;cursor:pointer;flex-shrink:0}
.tab.active{background:#E30613;color:white;border-color:#E30613}
.tab .num{background:#f1f5f9;color:#334155;min-width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700}
.tab.active .num{background:white;color:#E30613}
.container{padding:0 18px 30px}
.card{background:white;border-radius:14px;border:1px solid #e8edf5;padding:12px 14px;display:grid;grid-template-columns:200px 210px 170px 150px 190px;gap:10px;align-items:start;margin-bottom:12px;box-shadow:0 2px 10px rgba(0,0,0,.04);position:relative;overflow:hidden}
.card-top{grid-column:1 / -1;display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:4px;padding-right:170px}
.badge-id{background:#E30613;color:white;border-radius:999px;padding:4px 12px;font-size:11px;font-weight:800}
.top-right{position:absolute;right:14px;top:12px;display:flex;flex-direction:column;align-items:flex-end;gap:6px;z-index:2}
.time-row{display:flex;align-items:center;gap:8px;font-size:11px;color:#334155;font-weight:600}
.tiempo-real{border-radius:999px;padding:3px 10px;font-size:10px;font-weight:900;display:inline-flex;align-items:center;gap:4px;color:white}
.tiempo-verde{background:#16a34a}
.tiempo-amarillo{background:#EAB308}
.tiempo-rojo{background:#EF4444}
.map-btns{display:flex;flex-direction:column;gap:4px;align-items:flex-end}
.btn-mini-map{border:1px solid #e2e8f0;border-radius:999px;padding:4px 10px;font-size:9px;font-weight:600;display:flex;align-items:center;gap:4px;cursor:pointer;background:white;color:#334155}
.btn-mini-map.recogida{color:#E30613;border-color:#fecdd3;background:#fff1f2}
.btn-mini-map.entrega{background:#0f172a;color:white;border-color:#0f172a}
.btn-mini-map.llamar{background:#16a34a;color:white;border-color:#16a34a}
.col{display:flex;flex-direction:column;gap:4px}
.shop{display:flex;gap:10px}
.shop-icon{width:52px;height:52px;background:#f1f5f9;border:2px solid #e5e7eb;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;overflow:hidden}
.shop-icon img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.shop-name{font-size:13px;font-weight:700;color:#111}
.shop-sub{font-size:11px;color:#64748b}
.recoger b,.cliente b,.prod b,.tot b,.entrega b{font-size:11px;color:#111;display:flex;align-items:center;gap:4px}
.recoger span,.cliente .name,.entrega span{font-size:11px;color:#5b708a;line-height:1.2;display:block}
.cliente .tel{font-size:11px;color:#5b708a;display:flex;align-items:center;gap:4px}
.prod-list{margin-left:0;margin-top:4px;display:flex;flex-direction:column;gap:2px}
.prod-list div{display:flex;justify-content:space-between;font-size:11px;color:#5b708a}
.tot .val{font-size:14px;font-weight:800;color:#111}
.tot .ship{font-size:11px;color:#475569;margin-top:4px}
.tot .total{margin-top:8px;border-top:1px solid #e5e7eb;padding-top:6px}
.tot .total small{font-size:11px;color:#111;display:block}
.tot .total strong{font-size:18px;color:#E30613;font-weight:800}
.card-bottom{grid-column:1 / -1;display:flex;gap:8px;padding-top:10px;border-top:1px solid #f1f5f9;margin-top:4px;flex-wrap:wrap}
.btn-bottom{border-radius:10px;padding:9px 14px;font-size:11px;font-weight:700;display:flex;align-items:center;gap:6px;cursor:pointer;flex:1;justify-content:center;min-width:100px;border:1px solid #e2e8f0;transition:all .2s ease}
.btn-bottom.verde-activo{background:#16a34a;color:white;border-color:#16a34a;box-shadow:0 3px 10px rgba(22,163,74,.3)}
.btn-bottom.gris-bloqueado{background:#e5e7eb;color:#9ca3af;border-color:#e5e7eb;pointer-events:none;opacity:.7}
.btn-bottom.gris-hecho{background:#f1f5f9;color:#94a3b8;border-color:#e2e8f0;pointer-events:none}
.btn-bottom.cancelado-rojo{background:#E30613;color:white;border-color:#E30613;box-shadow:0 3px 10px rgba(227,6,19,.25)}
.card-overlay{position:absolute;inset:0;background:rgba(255,255,255,0.97);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;z-index:20;border-radius:14px;padding:10px}
.card-overlay.open{display:flex}
.overlay-cancel{width:460px;max-width:95%;background:white;border:1px solid #e5e7eb;border-radius:12px;box-shadow:0 12px 28px rgba(0,0,0,.16);padding:12px 14px;text-align:left}
.cancel-title{font-size:12.5px;font-weight:800;color:#111;margin-bottom:2px;display:flex;align-items:center;gap:6px}
.cancel-sub{font-size:10px;color:#64748b;margin-bottom:10px}
.cancel-opts{display:grid;grid-template-columns:1fr 1fr;gap:6px}
@media(max-width:600px){.cancel-opts{grid-template-columns:1fr}}
.cancel-opt{border:1px solid #e2e8f0;border-radius:8px;padding:7px 9px;font-size:10.5px;font-weight:600;color:#334155;display:flex;align-items:center;gap:6px;cursor:pointer;transition:all .12s;background:#fafafa;min-height:32px;line-height:1.2}
.cancel-opt:hover{border-color:#E30613;background:#fff1f2}
.cancel-opt.active{border-color:#E30613;background:#fff1f2;color:#E30613}
.cancel-opt input{accent-color:#E30613;width:12px;height:12px;flex-shrink:0}
.cancel-text{width:100%;border:1px solid #e2e8f0;border-radius:8px;padding:8px;font-size:10.5px;min-height:58px;resize:none;display:none;margin-top:8px;grid-column:1 / -1}
.cancel-text.show{display:block}
.cancel-text:focus{border-color:#E30613;outline:none}
.cancel-actions{display:flex;gap:8px;margin-top:10px}
.btn-cancel-no{flex:1;background:white;border:1px solid #e2e8f0;border-radius:8px;padding:8px;font-size:11px;font-weight:700;color:#475569;cursor:pointer}
.btn-cancel-si{flex:1;background:#E30613;border:none;border-radius:8px;padding:8px;font-size:11px;font-weight:800;color:white;cursor:pointer;box-shadow:0 3px 8px rgba(227,6,19,.25)}
.btn-cancel-si:disabled{background:#94a3b8;box-shadow:none;cursor:not-allowed}
@media(max-width:980px){.card{grid-template-columns:1fr 1fr;gap:14px}.card-top{padding-right:0}.top-right{position:relative;right:auto;top:auto;align-items:flex-start;margin-top:6px}.card-bottom{flex-wrap:wrap}}
@media(max-width:640px){.card{grid-template-columns:1fr}.card-top{flex-direction:column;gap:8px}.card-bottom{display:grid;grid-template-columns:1fr 1fr;gap:8px}.btn-bottom.cancelado-rojo{grid-column:1 / -1}}
</style>
</head>
<body>

<div class="header">
  <div class="left">
    <button class="btn-x" onclick="window.location.href='panelrepa.html'"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke-width="3" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    <h1>Pedidos</h1>
  </div>
  <div class="right"><div class="bell" id="bell"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#E30613" stroke-width="2"><path d="M6 8a6 6 0 0 1 12 0c0 7 6 5 6 9H0s6-2 6-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg><span class="bell-count" id="bellCount">0</span></div></div>
</div>

<div class="tabs">
  <div class="tab active" data-f="todos" onclick="filtrar('todos')">Todos <span class="num" id="c-todos">0</span></div>
  <div class="tab" data-f="activo" onclick="filtrar('activo')">Activo <span class="num" id="c-activo">0</span></div>
  <div class="tab" data-f="ir_a_recoger" onclick="filtrar('ir_a_recoger')">Ir a recoger <span class="num" id="c-ir_a_recoger">0</span></div>
  <div class="tab" data-f="recogido" onclick="filtrar('recogido')">Recogido <span class="num" id="c-recogido">0</span></div>
  <div class="tab" data-f="ir_a_entregar" onclick="filtrar('ir_a_entregar')">Ir a entregar <span class="num" id="c-ir_a_entregar">0</span></div>
  <div class="tab" data-f="entregado" onclick="filtrar('entregado')">Entregado <span class="num" id="c-entregado">0</span></div>
  <div class="tab" data-f="cancelado" onclick="filtrar('cancelado')">Cancelado <span class="num" id="c-cancelado">0</span></div>
</div>

<div class="container" id="lista"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import { getFirestore, collection, onSnapshot, doc, updateDoc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

// BASE 1 - ADMIN DONDE ESTA pedidos_admin
const configAdmin = {
  apiKey: "AIzaSyDLKngPyi_SWAXEQwdrHO5h8L8OufulAR4",
  authDomain: "doloya-confirmacion.firebaseapp.com",
  projectId: "doloya-confirmacion",
  storageBucket: "doloya-confirmacion.firebasestorage.app",
  messagingSenderId: "832228761099",
  appId: "1:832228761099:web:ddd4b6a0ee0d7f0494b10e"
};
const app = initializeApp(configAdmin);
const db = getFirestore(app);

// BASE 2 - HISTORIAL DONDE SE GUARDA CANCELADO (MISMA QUE ME ENVIASTE)
const configHistorial = {
  apiKey: "AIzaSyCRx4B7mO444s0yU-WTnsqMjBHDWX4IRv8",
  authDomain: "doloya-historial.firebaseapp.com",
  projectId: "doloya-historial",
  storageBucket: "doloya-historial.firebasestorage.app",
  messagingSenderId: "41258055121",
  appId: "1:41258055121:web:19a443786320e04ebd9cf0",
  measurementId: "G-ENELTJ1X6R"
};
const appHistorial = initializeApp(configHistorial, "historialApp");
const dbHistorial = getFirestore(appHistorial);

let sesion = JSON.parse(localStorage.getItem("repartidor_sesion")||'{"usuario":"Jose","nombre":"Jose"}');
let filtro = "todos";
let pedidos = [];
let ultimoCount = 0;
let primero = true;

function calcularTiempoReal(sec){
  if(!sec) return {texto:'0s', clase:'tiempo-verde'};
  const diff=Math.floor(Date.now()/1000-sec);
  const min=Math.floor(diff/60); const seg=diff%60;
  let texto=''; if(diff<60) texto=diff+'s'; else if(diff<3600) texto=min+'m '+seg+'s'; else {const h=Math.floor(min/60); const m=min%60; texto=h+'h '+m+'m';}
  let clase='tiempo-verde'; if(diff<840) clase='tiempo-verde'; else if(diff<1080) clase='tiempo-amarillo'; else clase='tiempo-rojo';
  return {texto, clase};
}

function sonarDoloYa(){
  const bell = document.getElementById('bell');
  bell.classList.add('vibrar');
  setTimeout(()=>bell.classList.remove('vibrar'), 3800);
  try{
    const ctx = new (window.AudioContext||window.webkitAudioContext)();
    ctx.resume();
    const osc1 = ctx.createOscillator(); const osc2 = ctx.createOscillator(); const gain = ctx.createGain();
    osc1.type='sine'; osc2.type='triangle';
    osc1.frequency.setValueAtTime(900, ctx.currentTime);
    osc1.frequency.linearRampToValueAtTime(1400, ctx.currentTime+0.2);
    osc1.frequency.linearRampToValueAtTime(800, ctx.currentTime+0.6);
    osc2.frequency.setValueAtTime(450, ctx.currentTime);
    gain.gain.setValueAtTime(0.9, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime+0.8);
    osc1.connect(gain); osc2.connect(gain); gain.connect(ctx.destination);
    osc1.start(); osc2.start(); osc1.stop(ctx.currentTime+0.8); osc2.stop(ctx.currentTime+0.8);
  }catch{}
  try{ const audio=new Audio("https://actions.google.com/sounds/v1/alarms/beep_short.ogg"); audio.volume=1; audio.play().catch(()=>{});}catch{}
  try{ speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance("Nuevo pedido DoloYa asignado"); u.lang='es-MX'; u.volume=1; speechSynthesis.speak(u);}catch{}
}

function mapEstado(p){
  const e = (p.estado||'').toLowerCase();
  if(['enviado_a_repartidor','activo','nuevo','pendiente'].includes(e)) return 'activo';
  if(['aceptado','ir_a_recoger'].includes(e)) return 'ir_a_recoger';
  if(['recogido'].includes(e)) return 'recogido';
  if(['en_camino','ir_a_entregar'].includes(e)) return 'ir_a_entregar';
  if(['entregado','finalizado'].includes(e)) return 'entregado';
  if(['cancelado'].includes(e)) return 'cancelado';
  return 'activo';
}

function getPaso(estado){
  const e=(estado||'').toLowerCase();
  if(['enviado_a_repartidor','activo','nuevo','pendiente','aceptado'].includes(e)) return 0;
  if(e==='ir_a_recoger') return 1;
  if(e==='recogido') return 2;
  if(['en_camino','ir_a_entregar'].includes(e)) return 3;
  if(['finalizado','entregado'].includes(e)) return 4;
  if(e==='cancelado') return 5;
  return 0;
}

function render(){
  const miosTodos = pedidos.filter(p=>{
    const esDeJose = p.repartidorId===sesion.usuario || p.repartidorId==='Jose' || p.repartidorNombre===sesion.nombre || p.repartidorNombre==='Jose';
    const yaFueEnviado = !['nuevo','listo_para_admin','listo','sin_enviar','',undefined].includes(p.estado);
    return esDeJose && yaFueEnviado;
  });

  // AHORA CANCELADOS Y FINALIZADOS YA NO APARECEN EN REPARTIDOR
  const mios = miosTodos.filter(p=>{
    const e=(p.estado||'').toLowerCase();
    return !['finalizado','entregado','cancelado'].includes(e);
  });
  
  const countsTodos = {todos:mios.length, activo:0, ir_a_recoger:0, recogido:0, ir_a_entregar:0, entregado:0, cancelado:0};
  mios.forEach(p=>{ const m=mapEstado(p); if(countsTodos[m]!==undefined) countsTodos[m]++; });
  const bellTotal = countsTodos.activo + countsTodos.ir_a_recoger;

  document.getElementById('c-todos').textContent=countsTodos.todos;
  document.getElementById('c-activo').textContent=countsTodos.activo;
  document.getElementById('c-ir_a_recoger').textContent=countsTodos.ir_a_recoger;
  document.getElementById('c-recogido').textContent=countsTodos.recogido;
  document.getElementById('c-ir_a_entregar').textContent=countsTodos.ir_a_entregar;
  document.getElementById('c-entregado').textContent=0;
  document.getElementById('c-cancelado').textContent=0;
  document.getElementById('bellCount').textContent=bellTotal;

  if(!primero && bellTotal>ultimoCount) sonarDoloYa();
  ultimoCount = bellTotal;
  primero=false;

  const filtrados = mios;
  const lista = document.getElementById('lista');
  
  if(filtrados.length===0){
    lista.innerHTML=`<div style="text-align:center;padding:60px 20px;color:#64748b;font-weight:600">No hay pedidos activos</div>`;
    return;
  }

  lista.innerHTML = filtrados.map(p=>{
    const codigoReal = p.codigo || p.id;
    const cliente = p.cliente?.nombre || p.nombre || p.detalles?.nombre || 'Cliente';
    const celular = p.cliente?.celular || p.telefono || p.detalles?.telefono || '';
    const restNombre = p.restaurante?.nombre || p.tienda?.nombre || 'Burger House';
    const restCat = p.restaurante?.categoria || 'Comida rápida';
    const restLogo = p.restaurante?.logo || p.tienda?.logo || p.restaurante?.imagen || '';
    const dirRecoger = p.restaurante?.direccion || p.tienda?.direccion || 'Av. Hidalgo #198';
    const colRecoger = p.restaurante?.colonia || 'Col. Centro, Dolores Hidalgo, Gto.';
    const dirEntrega = p.cliente?.direccion || p.direccionEntrega || 'Calle Independencia #124';
    const colEntrega = p.cliente?.colonia || 'Col. Centro';
    const prods = p.productos || [];
    
    const costoProdBase = Number(p.totales?.costoProductos ?? p.totales?.totalProductos ?? p.totales?.subtotal ?? 480);
    const tarifaServicio = Number(p.totales?.tarifaServicio ?? p.totales?.tarifa ?? p.totales?.servicio ?? p.totales?.comision ?? 0);
    const totalPedidoConTarifa = costoProdBase + tarifaServicio;
    const costoEnvio = Number(p.totales?.costoEnvio ?? p.totales?.envio ?? 26.2);
    const totalFinal = totalPedidoConTarifa + costoEnvio;
    
    let tsSec=0; let horaStr='02:07 p.m.';
    if(p.enviadoARepartidorEn?.seconds) tsSec=p.enviadoARepartidorEn.seconds;
    else if(p.timestamp?.seconds) tsSec=p.timestamp.seconds;
    else if(p.timestampAdmin?.seconds) tsSec=p.timestampAdmin.seconds;
    if(tsSec) horaStr=new Date(tsSec*1000).toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit'});
    const tiempo = calcularTiempoReal(tsSec);

    const paso = getPaso(p.estado);
    let clsRecoger = paso===0 ? 'verde-activo' : paso>0 ? 'gris-hecho' : 'gris-bloqueado';
    let clsTengo = paso===1 ? 'verde-activo' : paso>1 ? 'gris-hecho' : 'gris-bloqueado';
    let clsEntregar = paso===2 ? 'verde-activo' : paso>2 ? 'gris-hecho' : 'gris-bloqueado';
    let clsEntregado = paso===3 ? 'verde-activo' : paso>3 ? 'gris-hecho' : 'gris-bloqueado';

    return `
    <div class="card" id="card-${p.id}">
      <div class="card-top">
        <span class="badge-id">#${codigoReal}</span>
        <div class="top-right">
          <div class="time-row"><span>${horaStr}</span><span class="tiempo-real ${tiempo.clase}" data-ts="${tsSec}">${tiempo.texto}</span></div>
          <div class="map-btns">
            <button class="btn-mini-map recogida" onclick="irRecoger('${dirRecoger}')"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13S3 17 3 10a9 9 0 0 1 18 0z"/></svg> Mapa de recogida</button>
            <button class="btn-mini-map entrega" onclick="openMaps('${dirEntrega}')"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"/></svg> Mapa de entrega</button>
            <button class="btn-mini-map llamar" onclick="llamar('${celular}')"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 6 12.5 19.79 19.79 0 0 1 3.07 3.87 2 2 0 0 1 5.05 1.5h3a2 2 0 0 1 2 1.72c.12.9.32 1.77.6 2.61a2 2 0 0 1-.45 2.11L9.09 9.09a16 16 0 0 0 6 6l1.15-1.15a2 2 0 0 1 2.11-.45c.84.28 1.71.48 2.61.6A2 2 0 0 1 22 16.92z"/></svg> Llamar al cliente</button>
          </div>
        </div>
      </div>
      <div class="col">
        <div class="shop"><div class="shop-icon">${restLogo ? `<img src="${restLogo}">` : `LOGO`}</div><div><div class="shop-name">${restNombre}</div><div class="shop-sub">${restCat}</div></div></div>
        <div class="recoger"><b>Recoger en:</b><span>${dirRecoger}<br>${colRecoger}</span></div>
      </div>
      <div class="col cliente"><b>Cliente:</b><div class="name">${cliente}</div><div class="tel">${celular}</div></div>
      <div class="col prod"><b>Productos:</b><div class="prod-list">${prods.length>0 ? prods.map(pr=>`<div><span>${pr.nombre||pr.name}</span><span>x${pr.cantidad||1}</span></div>`).join('') : `<div><span>Hamburguesa clásica</span><span>x1</span></div>`}</div></div>
      <div class="col tot"><b>Total del pedido</b><div class="val">$${totalPedidoConTarifa.toFixed(1)} MXN</div><div class="ship">Envío<br>$${costoEnvio.toFixed(1)} MXN</div><div class="total"><small>Total</small><strong>$${totalFinal.toFixed(1)} MXN</strong></div></div>
      <div class="col entrega"><b>Entrega en:</b><span>${dirEntrega}<br>${colEntrega}</span></div>
      
      <div class="card-bottom">
        <button class="btn-bottom ${clsRecoger}" onclick="accion('${p.id}','ir_a_recoger')"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13S3 17 3 10a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg> Ir a recoger</button>
        <button class="btn-bottom ${clsTengo}" onclick="accion('${p.id}','recogido')"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2"/></svg> Lo tengo</button>
        <button class="btn-bottom ${clsEntregar}" onclick="accion('${p.id}','ir_a_entregar')"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="5.5" cy="17.5" r="3.5"/><circle cx="18.5" cy="17.5" r="3.5"/><path d="M5 17h13l2-7H8"/></svg> Ir a entregar</button>
        <button class="btn-bottom ${clsEntregado}" onclick="accion('${p.id}','entregado')"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><path d="M20 6L9 17l-5-5"/></svg> Entregado</button>
        <button class="btn-bottom cancelado-rojo" onclick="abrirCancelar('${p.id}')"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg> Cancelado</button>
      </div>

      <div class="card-overlay" id="overlay-cancel-${p.id}">
        <div class="overlay-cancel">
          <div class="cancel-title"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#E30613" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg> ¿Por qué cancelas?</div>
          <div class="cancel-sub">Pedido #${codigoReal} - Elige motivo</div>
          <div class="cancel-opts" id="opts-${p.id}">
            <label class="cancel-opt" onclick="seleccionarMotivo('${p.id}','Cliente no respondió')"><input type="radio" name="motivo-${p.id}" value="Cliente no respondió"> Cliente no respondió</label>
            <label class="cancel-opt" onclick="seleccionarMotivo('${p.id}','Ubicación no existe')"><input type="radio" name="motivo-${p.id}" value="Ubicación no existe"> Ubicación no existe</label>
            <label class="cancel-opt" onclick="seleccionarMotivo('${p.id}','Estoy llamando no contestan')"><input type="radio" name="motivo-${p.id}" value="Estoy llamando no contestan"> No contestan</label>
            <label class="cancel-opt" onclick="seleccionarMotivo('${p.id}','No sale nadie')"><input type="radio" name="motivo-${p.id}" value="No sale nadie"> No sale nadie</label>
            <label class="cancel-opt" onclick="seleccionarMotivo('${p.id}','Me manifiestan que aquí no pidieron nada')"><input type="radio" name="motivo-${p.id}" value="Me manifiestan que aquí no pidieron nada"> No pidieron nada</label>
            <label class="cancel-opt" onclick="seleccionarMotivo('${p.id}','Otro')"><input type="radio" name="motivo-${p.id}" value="Otro"> Otro</label>
            <textarea class="cancel-text" id="texto-${p.id}" placeholder="Explica por qué cancelas..."></textarea>
          </div>
          <div class="cancel-actions">
            <button class="btn-cancel-no" onclick="cerrarCancelar('${p.id}')">No</button>
            <button class="btn-cancel-si" id="btnSi-${p.id}" disabled onclick="confirmarCancelar('${p.id}')">Cancelar</button>
          </div>
        </div>
      </div>

    </div>`;
  }).join('');
}

window.filtrar = (f)=>{ filtro=f; document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active', t.dataset.f===f)); render(); }

window.abrirCancelar = (id)=>{ document.getElementById('overlay-cancel-'+id)?.classList.add('open'); }
window.cerrarCancelar = (id)=>{
  document.getElementById('overlay-cancel-'+id)?.classList.remove('open');
  document.querySelectorAll(`input[name="motivo-${id}"]`).forEach(r=>r.checked=false);
  document.querySelectorAll(`#opts-${id} .cancel-opt`).forEach(o=>o.classList.remove('active'));
  const txt=document.getElementById('texto-'+id); if(txt){ txt.value=''; txt.classList.remove('show'); }
  const btn=document.getElementById('btnSi-'+id); if(btn) btn.disabled=true;
}
window.seleccionarMotivo = (id, motivo)=>{
  document.querySelectorAll(`#opts-${id} .cancel-opt`).forEach(o=>o.classList.remove('active'));
  const radio = document.querySelector(`input[name="motivo-${id}"][value="${motivo}"]`);
  if(radio){ radio.checked=true; radio.parentElement.classList.add('active'); }
  const txt=document.getElementById('texto-'+id);
  const btn=document.getElementById('btnSi-'+id);
  if(motivo==='Otro'){
    txt.classList.add('show');
    txt.focus();
    btn.disabled = txt.value.trim().length < 3;
    txt.oninput = ()=>{ btn.disabled = txt.value.trim().length < 3; };
  }else{
    txt.classList.remove('show');
    txt.value='';
    btn.disabled=false;
  }
}
window.confirmarCancelar = async (id)=>{
  const sel = document.querySelector(`input[name="motivo-${id}"]:checked`);
  if(!sel){ alert('Selecciona un motivo'); return; }
  let motivo = sel.value;
  const txt=document.getElementById('texto-'+id);
  let detalle = '';
  if(motivo==='Otro'){
    detalle = txt.value.trim();
    if(detalle.length<3){ alert('Explica el motivo'); return; }
  }
  
  const pedidoActual = pedidos.find(p=>p.id===id);
  
  // 1. QUITAR AL INSTANTE DE REPARTIDOR
  const cardEl = document.getElementById('card-'+id);
  if(cardEl){ cardEl.style.transition='all .25s'; cardEl.style.opacity='0'; cardEl.style.transform='scale(0.96)'; }
  setTimeout(()=>{
    pedidos = pedidos.filter(p=>p.id!==id);
    render();
  },250);
  cerrarCancelar(id);

  try{
    // 2. ACTUALIZAR EN ADMIN COMO CANCELADO
    await updateDoc(doc(db,"pedidos_admin",id),{
      estado:'cancelado',
      estadoRepartidor:'cancelado',
      motivoCancelacion: motivo,
      detalleCancelacion: detalle,
      canceladoPor: sesion.usuario,
      canceladoPorNombre: sesion.nombre,
      canceladoEn: new Date(),
      actualizadoEn: new Date().toISOString()
    });

    // 3. GUARDAR EN HISTORIAL - pedidos_cancelados (MISMA RUTA)
    if(pedidoActual){
      await setDoc(doc(dbHistorial, "pedidos_cancelados", id), {
        ...pedidoActual,
        estado:'cancelado',
        estadoOriginal: pedidoActual.estado,
        motivoCancelacion: motivo,
        detalleCancelacion: detalle,
        canceladoPor: sesion.usuario,
        canceladoPorNombre: sesion.nombre,
        canceladoEn: new Date(),
        guardadoDesde: 'doloya-confirmacion',
        tipo: 'cancelado'
      });
    }

    try{
      const otro = doc(db,"pedidos",id);
      const snap = await getDoc(otro);
      if(snap.exists()){
        await updateDoc(otro,{estado:'cancelado', motivoCancelacion:motivo, detalleCancelacion:detalle});
      }
    }catch{}

  }catch(e){ 
    console.error(e);
    alert('Error al cancelar: '+e.message); 
  }
}

window.accion = async (id, estado)=>{
  let real = estado;
  if(estado==='ir_a_recoger') real='ir_a_recoger';
  if(estado==='recogido') real='recogido';
  if(estado==='ir_a_entregar') real='en_camino';
  if(estado==='entregado') real='finalizado';
  if(estado==='cancelado') real='cancelado';
  try{
    await updateDoc(doc(db,"pedidos_admin",id),{
      estado:real,
      estadoRepartidor:real,
      actualizadoEn:new Date().toISOString(),
      actualizadoPor: sesion.usuario
    });
    try{
      const otro = doc(db,"pedidos",id);
      const snap = await getDoc(otro);
      if(snap.exists()){
        await updateDoc(otro,{estado:real, estadoRepartidor:real, actualizadoEn:new Date().toISOString()});
      }
    }catch{}
  }catch(e){ alert(e.message); }
}
window.irRecoger = (dir)=>{ window.open(`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(dir)}`,'_blank'); }
window.openMaps = (dir)=>{ window.open(`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(dir)}`,'_blank'); }
window.llamar = (tel)=>{ if(tel) window.location.href=`tel:${tel}`; else alert('Sin teléfono'); }

setInterval(()=>{
  document.querySelectorAll('.tiempo-real').forEach(el=>{
    const ts=parseInt(el.dataset.ts||0); if(ts){ const t=calcularTiempoReal(ts); el.textContent=t.texto; el.className='tiempo-real '+t.clase; }
  });
},1000);

document.addEventListener('click', function unlock(){ try{ const ctx=new (window.AudioContext||window.webkitAudioContext)(); ctx.resume(); }catch{}; document.removeEventListener('click', unlock); }, {once:true});

onSnapshot(collection(db,"pedidos_admin"), (snap)=>{
  pedidos = snap.docs.map(d=>({id:d.id, ...d.data()}));
  render();
});
</script>
</body>
</html>
