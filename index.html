<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Soy DoloYa - Repartidores</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif}
body{background:#fff;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:22px 18px 30px}
.logo{margin-top:14px;text-align:center;line-height:.9}
.logo .soy{font-size:44px;font-weight:900;color:#000}
.logo .doloya{font-size:56px;font-weight:900;letter-spacing:-1.5px}
.logo .doloya .r{color:#E30613;font-style:italic}
.logo .doloya .b{color:#000}
.logo .doloya .y{color:#E30613}
.repa{display:flex;align-items:center;gap:12px;justify-content:center;margin-top:6px}
.repa .line{width:42px;height:4px;background:#E30613;border-radius:2px}
.repa b{font-size:20px;font-weight:800;color:#111}
.moto{width:320px;max-width:90%;margin:18px 0 8px}
.moto img{width:100%;object-fit:contain}
.form{width:100%;max-width:400px;display:flex;flex-direction:column;gap:14px;margin-top:10px}
.input{border:1.6px solid #dde4ee;border-radius:999px;padding:12px 16px;display:flex;align-items:center;gap:12px;background:white}
.input:focus-within{border-color:#E30613}
.icon{width:38px;height:38px;background:#fff;border:1.6px solid #E30613;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:#E30613}
.txt{flex:1;display:flex;flex-direction:column}
.txt label{font-size:13px;font-weight:800;color:#111}
.txt input{border:none;outline:none;font-size:13px;margin-top:2px;color:#111}
.txt input::placeholder{color:#9aa6b8}
.eye{cursor:pointer;display:flex;align-items:center}
.btn{width:100%;background:#E30613;border:none;border-radius:999px;padding:15px;display:flex;align-items:center;justify-content:center;gap:10px;color:white;font-size:17px;font-weight:800;cursor:pointer;margin-top:6px;box-shadow:0 8px 20px rgba(227,6,19,.28)}
.btn:active{transform:scale(.98)}
.error-msg{display:none;margin-top:4px;background:#0b0b0b;color:#ff2a2a;border:1px solid #ff2a2a;border-radius:10px;padding:10px 12px;font-size:12px;font-weight:800;text-align:center;box-shadow:0 0 12px rgba(255,0,0,.6), inset 0 0 8px rgba(255,0,0,.15);text-transform:uppercase;letter-spacing:.3px}
.error-msg.show{display:block;animation:shake .3s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.foot{margin-top:14px;font-size:11px;color:#6b7280;display:flex;align-items:center;gap:6px}
</style>
</head>
<body>

<div class="logo">
  <div class="soy">Soy</div>
  <div class="doloya"><span class="r">Dolo</span><span class="b">Ya</span></div>
  <div class="repa"><div class="line"></div><b>Repartidores</b><div class="line"></div></div>
</div>

<div class="moto">
  <img src="https://i.ibb.co/3Y4q3N3d/moto-roja.png" alt="moto" onerror="this.src='https://cdn-icons-png.flaticon.com/512/2972/2972210.png'">
</div>

<div class="form">
  <div class="input">
    <div class="icon">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#E30613" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>
    </div>
    <div class="txt">
      <label>Inicio de sesión</label>
      <input id="usuario" type="text" placeholder="Ingresa tu usuario" autocomplete="off">
    </div>
  </div>

  <div class="input">
    <div class="icon">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#E30613" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/><circle cx="12" cy="16" r="1.5" fill="#E30613"/></svg>
    </div>
    <div class="txt">
      <label>Contraseña</label>
      <input id="clave" type="password" placeholder="Ingresa tu contraseña">
    </div>
    <div class="eye" onclick="toggle()">
      <svg id="eye" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#6b7280" stroke-width="2"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>
    </div>
  </div>

  <button class="btn" id="btnLogin">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
    Iniciar sesión
  </button>

  <div id="error" class="error-msg">⚠ Usuario y contraseña incorrectos</div>

  <div class="foot">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#6b7280" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
    Al continuar, aceptas nuestros términos y políticas de privacidad
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import { getDatabase, ref, set, get, child } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyCYdy62kQCPEhz1d-Ln9H-sup2iOTYJPwU",
  authDomain: "doloya-repartidores.firebaseapp.com",
  databaseURL: "https://doloya-repartidores-default-rtdb.firebaseio.com",
  projectId: "doloya-repartidores",
  storageBucket: "doloya-repartidores.firebasestorage.app",
  messagingSenderId: "308893983803",
  appId: "1:308893983803:web:fe2b85c80f3a203de9a81e"
};
const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

// CREA JOSE EN REALTIME SI NO EXISTE
set(ref(db, 'repartidores/Jose'), {
  usuario: "Jose",
  nombre: "Jose",
  password: "1234",
  rol: "repartidor",
  estado: "disponible",
  creadoEn: new Date().toISOString()
});

window.toggle = ()=>{
  const c=document.getElementById('clave');
  c.type = c.type==='password'?'text':'password';
}

const errorDiv = document.getElementById('error');

document.getElementById('btnLogin').addEventListener('click', async ()=>{
  const u=document.getElementById('usuario').value.trim();
  const p=document.getElementById('clave').value.trim();
  errorDiv.classList.remove('show');
  
  if(!u || !p){
    errorDiv.textContent="⚠ Ingresa usuario y contraseña";
    errorDiv.classList.add('show');
    return;
  }

  try{
    const snap = await get(child(ref(db), `repartidores/${u}`));
    if(snap.exists() && snap.val().password===p){
      localStorage.setItem("repartidor_sesion", JSON.stringify(snap.val()));
      window.location.href="panelrepa.html";
    }else{
      // valida también Jose con case insensitive
      const snapJose = await get(child(ref(db), `repartidores/Jose`));
      if(u.toLowerCase()==="jose" && p==="1234"){
        localStorage.setItem("repartidor_sesion", JSON.stringify(snapJose.val()));
        window.location.href="panelrepa.html";
      }else{
        errorDiv.textContent="✖ Usuario y contraseña incorrectos";
        errorDiv.classList.add('show');
      }
    }
  }catch(e){
    if(u.toLowerCase()==="jose" && p==="1234"){
      localStorage.setItem("repartidor_sesion", JSON.stringify({usuario:"Jose", nombre:"Jose", rol:"repartidor"}));
      window.location.href="panelrepa.html";
    }else{
      errorDiv.textContent="✖ Usuario y contraseña incorrectos";
      errorDiv.classList.add('show');
    }
  }
});
</script>
</body>
</html>
