<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Soy DoloYa - Repartidores</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#fff;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:18px}
.soy{font-size:38px;font-weight:900;text-align:center;margin-top:10px}
.dolo{font-size:54px;font-weight:900;text-align:center}
.dolo span:first-child{color:#E30613;font-style:italic}
.dolo span:last-child{color:#E30613}
.repa{font-size:20px;font-weight:800;text-align:center;margin:6px 0 10px;display:flex;align-items:center;gap:12px;justify-content:center}
.repa::before,.repa::after{content:'';width:36px;height:4px;background:#E30613;border-radius:2px;display:inline-block}
.moto{width:300px;max-width:90%;margin:10px auto}
.moto img{width:100%}
.box{width:100%;max-width:380px;border:1.5px solid #d9e0ea;border-radius:999px;padding:12px 16px;display:flex;align-items:center;gap:12px;margin-top:12px}
.box b{font-size:14px;display:block}
.box input{border:none;outline:none;width:100%;font-size:13px;color:#333}
.icon{background:#E30613;width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:white;font-weight:900}
.btn{width:100%;max-width:380px;background:#E30613;border:none;border-radius:999px;color:white;padding:15px;font-size:17px;font-weight:800;margin-top:18px;display:flex;align-items:center;justify-content:center;gap:10px;cursor:pointer}
.foot{font-size:11px;color:#777;margin-top:14px;display:flex;align-items:center;gap:6px}
</style>
</head>
<body>

<div class="soy">Soy</div>
<div class="dolo"><span>Dolo</span><span style="color:black">Ya</span></div>
<div class="repa">Repartidores</div>

<div class="moto">
<img src="https://cdn-icons-png.flaticon.com/512/2972/2972210.png" style="filter:hue-rotate(-10deg)" onerror="this.src='https://i.imgur.com/8Km9tLL.png'">
</div>

<div class="box">
  <div class="icon">👤</div>
  <div style="flex:1"><b>Inicio de sesión</b><input id="user" placeholder="Ingresa tu usuario" value="Jose"></div>
</div>

<div class="box">
  <div class="icon">🔒</div>
  <div style="flex:1"><b>Contraseña</b><input id="pass" type="password" placeholder="Ingresa tu contraseña" value="1234"></div>
  <div onclick="document.getElementById('pass').type=document.getElementById('pass').type=='password'?'text':'password'" style="cursor:pointer">👁️</div>
</div>

<button class="btn" id="btnLogin">↪ Iniciar sesión</button>

<div class="foot">🔒 Al continuar, aceptas nuestros términos y políticas de privacidad</div>
<div id="msg" style="margin-top:12px;font-size:12px;color:#E30613;font-weight:700;text-align:center"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import { getDatabase, ref, set, get, child } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyCYdy62kQCPEhz1d-Ln9H-sup2iOTYJPwU",
  authDomain: "doloya-repartidores.firebaseapp.com",
  databaseURL: "https://doloya-repartidores-default-rtdb.firebaseio.com",
  projectId: "doloya-repartidores",
  storageBucket: "doloya-repartidores.firebasestorage.app",
  messagingSenderId: "308893983803",
  appId: "1:308893983803:web:fe2b85c80f3a203de9a81e"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

// CREAR JOSE AUTOMATICAMENTE EN REALTIME
async function crearJose(){
  try{
    await set(ref(db, 'repartidores/Jose'), {
      usuario: "Jose",
      nombre: "Jose",
      password: "1234",
      rol: "repartidor",
      estado: "disponible",
      creadoEn: new Date().toISOString()
    });
    console.log("Jose creado en RTDB");
  }catch(e){
    document.getElementById('msg').textContent = "Error RTDB: " + e.message + " - Activa las reglas";
  }
}
crearJose();

document.getElementById('btnLogin').addEventListener('click', async ()=>{
  const u = document.getElementById('user').value.trim();
  const p = document.getElementById('pass').value.trim();
  const msg = document.getElementById('msg');
  
  if(!u || !p){ msg.textContent="Ingresa usuario y contraseña"; return; }

  msg.textContent="Ingresando...";

  // LOGIN LOCAL SIEMPRE FUNCIONA
  if(u.toLowerCase()==="jose" && p==="1234"){
    localStorage.setItem("repartidor_sesion", JSON.stringify({usuario:"Jose", nombre:"Jose", rol:"repartidor"}));
    window.location.href="panelrepa.html";
    return;
  }

  // INTENTAR EN REALTIME TAMBIEN
  try{
    const snap = await get(child(ref(db), `repartidores/${u}`));
    if(snap.exists()){
      const data = snap.val();
      if(data.password===p){
        localStorage.setItem("repartidor_sesion", JSON.stringify(data));
        window.location.href="panelrepa.html";
      }else{
        msg.textContent="Contraseña incorrecta";
      }
    }else{
      msg.textContent="Usuario no encontrado - Usa Jose / 1234";
    }
  }catch(e){
    // SI FALLA POR REGLAS, DEJA ENTRAR IGUAL CON JOSE
    if(u.toLowerCase()==="jose" && p==="1234"){
      localStorage.setItem("repartidor_sesion", JSON.stringify({usuario:"Jose"}));
      window.location.href="panelrepa.html";
    }else{
      msg.textContent="Error Firebase: "+e.message;
    }
  }
});
</script>
</body>
</html>
